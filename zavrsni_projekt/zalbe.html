<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Žalbe</title>
  <link rel="stylesheet" href="Projekt_SJWP.css">
</head>
<body>

<header class="x-os-centar redci">
  <section class="logo">
    <img src="slike/projekt_logo.png" alt="Logo">
  </section>
  <h1 class="naslov">Žalbe</h1>
  <section class="logo zrcaljeno">

  </section>
</header>

<main class="zalba-container">
  <section class="zalba-kartica">
    <form action="#" method="post">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Unesite svoj e-mail" required>

      <label for="zalba">Vaša žalba:</label>
      <textarea id="zalba" name="zalba" placeholder="Napišite svoju žalbu ovdje..." required></textarea>

      <section class="zalba-kategorije">
        <p>Odaberite kategoriju žalbe:</p>

        <label for="tehnički-problem">
          <input type="radio" id="tehnički-problem" name="zalba-kategorija" value="Tehnički problem">
          Tehnički problem
        </label>

        <label for="usluga">
          <input type="radio" id="usluga" name="zalba-kategorija" value="Usluga">
          Usluga
        </label>

        <label for="drugo">
          <input type="radio" id="drugo" name="zalba-kategorija" value="Drugo">
          Drugo
        </label>
      </section>


      <section class="zalba-gumbi">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </section>
    </form>
  </section>
</main>



<footer class="x-os-centar redci">
  <nav class="meni">
    <a href="index.html">Početna</a>
    <a href="usluge.html">Usluge</a>
    <a href="kontakti.html">Kontakti</a>
    <a href="zalbe.html">Žalbe</a>
    <a href="nase_ideje.html">Naše ideje</a>
  </nav>
</footer>

</body>
</html>
